name: Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  paved-road-release:
    uses: bonjoski/.github/.github/workflows/paved-road-release.yml@5c95f5f0b0d71a7bf076439e523fd52a61128d25
    with:
      build_command: "go build -trimpath -o dist/fabrial-linux-amd64 ./cmd/fabrial"
      artifact_path: "dist/fabrial-linux-amd64"
      provenance_path: "dist/fabrial-linux-amd64.intoto.jsonl"
      sbom_path: "dist/fabrial.cdx.json"
      go_version: "1.27"
      verify_git_signature: true
      enable_cosign: true
      publish_github_release: true
